<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>社宅招租</title>
<style>
:root{--stage:#000;--bg:#000;--card:#1c1c1e;--ink:#fff;--sub:#98989f;--line:#38383a;--blue:#0a84ff;--red:#ff453a;--green:#30d158;--amber:#ff9f0a;--fill:#2c2c2e;--glass:rgba(20,20,22,.85);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:-apple-system,"SF Pro Text","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
/* iPhone 外框 */
.phone{position:relative;width:390px;height:844px;max-height:96vh;background:var(--bg);border-radius:56px;box-shadow:0 0 0 11px #1a1a1c,0 0 0 13px #55555a,0 40px 90px rgba(0,0,0,.45);overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:30}
.status{flex:none;height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 34px 8px 40px;font-weight:600;font-size:16px;z-index:20;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.status .r{display:flex;gap:6px;align-items:center}
.batt{width:25px;height:12px;border:1.5px solid var(--sub);border-radius:4px;position:relative;padding:1px}
.batt i{display:block;height:100%;width:78%;background:var(--ink);border-radius:1.5px}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:var(--sub);border-radius:0 1px 1px 0}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:20px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
h1{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:6px 0 2px}
.sub{color:var(--sub);font-size:14px;margin-bottom:8px}
.bar{position:sticky;top:0;z-index:5;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:8px 0;margin:0 -16px;padding-left:16px;padding-right:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;height:38px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;outline:0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:500;padding:6px 0;border-radius:7px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:14px;padding:7px 14px;border-radius:99px;cursor:pointer;transition:.2s}
.chip.on{background:var(--blue);color:#fff}
.count{margin:14px 4px 8px;font-size:13px;color:var(--sub)}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;animation:up .45s both;transition:transform .15s}
.card:active{transform:scale(.985)}
.card.upcoming{outline:2px dashed color-mix(in srgb,var(--amber) 55%,transparent);outline-offset:-2px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top>div:first-child{min-width:0}
.city{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.5px}
h3{margin:2px 0 0;font-size:20px;font-weight:700;letter-spacing:-.2px}
.addr{color:var(--sub);font-size:13px;margin-top:3px}
.badge{flex:none;text-align:center;border-radius:14px;padding:6px 10px;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);min-width:62px}
.badge b{display:block;font-size:22px;line-height:1.1;font-weight:800}
.badge span{font-size:11px;font-weight:600}
.badge.ok{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}
.badge.soon{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.badge.off{background:var(--fill);color:var(--sub)}
.deadline{margin-top:12px;font-size:15px;font-weight:700;color:var(--red);display:flex;align-items:center;gap:6px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(1.5)}}
.deadline.soon{color:var(--amber)}.deadline.soon .dot{background:var(--amber)}
.deadline.off{color:var(--sub)}.deadline.off .dot{background:var(--sub);animation:none}
.draw{margin-top:8px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.draw span{font-size:12px;font-weight:700;color:var(--blue);background:color-mix(in srgb,var(--blue) 16%,transparent);padding:2px 8px;border-radius:99px}
.draw small{font-size:12px;font-weight:500;color:var(--sub)}
.price{margin-top:10px;font-size:15px}.price b{font-size:28px;font-weight:800;letter-spacing:-.5px}
.tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--fill)}
.info{margin-top:10px;font-size:13px;color:var(--sub);line-height:1.7}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px;border-radius:12px;overflow:hidden;background:var(--bg)}
td,th{padding:7px 10px;text-align:left}th{color:var(--sub);font-weight:500;font-size:12px}
td+td,th+th{text-align:right}tr+tr td{border-top:1px solid var(--line)}
.btns{margin-top:14px;display:flex;gap:10px}
.btn{flex:1;text-align:center;text-decoration:none;font-size:16px;font-weight:600;padding:12px;border-radius:14px;background:var(--blue);color:#fff;transition:.15s}
.btn:active{opacity:.6;transform:scale(.97)}
.btn.alt{flex:none;background:var(--fill);color:var(--blue);padding:12px 16px}
.empty{text-align:center;color:var(--sub);padding:60px 0}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:20px;line-height:1.6}
details{background:var(--card);border-radius:16px;padding:12px 16px;margin-top:8px}
summary{color:var(--blue);cursor:pointer;font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.form input,.form select{border:0;background:var(--fill);color:var(--ink);font:inherit;font-size:15px;padding:10px;border-radius:10px;min-width:0}
.form label{font-size:12px;color:var(--sub);min-width:0}
.form label input{width:100%}
.form button{grid-column:1/-1;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:600;padding:11px;border-radius:12px}
/* 底部分頁列 */
.tabbar{flex:none;display:flex;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding:7px 0 24px;position:relative}
.tab{flex:1;border:0;background:transparent;color:var(--sub);font:inherit;font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--blue)}
.tab em{position:absolute;top:-3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:700;line-height:18px;padding:0 5px}
.tab em.z{display:none}
.home{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.9}
/* 不做手機外框：整頁鋪滿，只保留 iPhone 的視覺風格 */
body{display:block}
.phone{width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}
.island,.status,.home{display:none}
.screen{padding-top:12px}
.screen>*{max-width:860px;margin-left:auto;margin-right:auto}
.bar{margin:0 auto;padding-left:0;padding-right:0}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,370px),1fr));gap:14px;align-items:start}
#list .card,#list .empty{margin-bottom:0}
#list .empty{grid-column:1/-1}
.tabbar{padding:7px 0 max(8px,env(safe-area-inset-bottom,0px));justify-content:center}
.tab{flex:0 1 200px}
.tab svg{width:24px;height:24px}
.tab{font-size:11px}
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="status"><span id="clock">9:41</span><span class="r"><span>5G</span><span class="batt"><i></i></span></span></div>
  <div class="screen" id="screen">
    <h1>社宅招租</h1>
    <div class="sub">台北市・新北市 政府辦理</div>
    <div class="bar">
      <div class="search"><span>🔍</span><input id="q" placeholder="搜尋社宅、行政區、房型" type="search"></div>
      <div class="seg" id="seg"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="count" id="count"></div>
    <div id="list"></div>
    <details><summary>＋ 新增一筆招租</summary>
      <form class="form" id="addForm">
        <input name="name" placeholder="社宅名稱*" required style="grid-column:1/-1">
        <select name="city"><option>台北市</option><option>新北市</option></select>
        <input name="dist" placeholder="行政區">
        <input name="rooms" placeholder="房型 一房,二房">
        <input name="minRent" type="number" placeholder="最低月租">
        <input name="units" type="number" placeholder="戶數">
        <span></span>
        <label>開放日（選填，未來日期＝即將開放）<input name="start" type="date"></label>
        <label>截止日<input name="end" type="date" required></label>
        <label>抽籤日（選填）<input name="drawDate" type="date"></label>
        <input name="url" placeholder="官方公告網址">
        <button>加入</button>
      </form>
    </details>
    <div class="note">資料整理自官方公告與媒體彙整（2026/11），租金為定價，<br>實際以官方公告為準。狀態依今天日期自動更新。</div>
  </div>
  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-t="open"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>受理中<em id="n-open" class="z"></em></button>
    <button class="tab" data-t="soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>即將開放<em id="n-soon" class="z"></em></button>
    <button class="tab" data-t="closed"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>已截止</button>
    <div class="home"></div>
  </nav>
</div>

<script>
// 內建資料：新的招租加在這裡，或用頁面下方「新增」表單
const BASE=[
{name:"興隆社會住宅 I 區",city:"台北市",dist:"文山區",addr:"興隆路四段107巷",rooms:["一房","二房","三房"],units:471,minRent:15824,
 start:"2026-10-30",end:"2026-11-13",endText:"11/13（五）17:00 截止",drawDate:"2026-11-27",drawText:"11/27（五）公開抽籤",draw:"2027/3 後分批入住",operator:"臺北市住都中心",
 rent:[["一房 16~18坪","15,824~17,760"],["二房 26~31坪","25,722~30,612"],["三房 34坪","33,684"]],

 start:"2026-10-30",end:"2026-11-13",endText:"11/13（五）17:00 截止",drawDate:"2026-11-27",drawText:"11/27（五）公開抽籤",draw:"2027/3 後分批入住",operator:"臺北市住都中心",

 start:"2026-10-30",end:"2026-11-13",endText:"11/13（五）17:00 截止",drawDate:"2026-11-27",drawText:"11/27（五）公開抽籤",draw:"2027/4 後分批入住",operator:"臺北市住都中心",

 start:"2026-08-14",end:"2026-09-14",endText:"9/14（一）截止",drawDate:"2026-12-16",drawText:"12/16（三）公開抽籤",draw:"最快 2027/3/1 起入住",operator:"國家住都中心（中央社宅第 3 季）",
 rent:[],src:"https://applealmondrealty.com/posts/51457"}
// 即將開放的案子：start 設成未來日期（YYYY-MM-DD），頁面會自動標成「即將開放」，到期後自動變成「受理中」
// 例：{name:"某某社宅",city:"新北市",dist:"板橋區",rooms:["一房"],start:"2027-01-15",end:"2027-02-14",endText:"2/14 截止",url:"..."}
];
const $=id=>document.getElementById(id);
const store=()=>{try{return JSON.parse(localStorage.getItem("extra")||"[]")}catch(e){return[]}};
const save=a=>{try{localStorage.setItem("extra",JSON.stringify(a))}catch(e){}};
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const todayStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const tick=()=>{const d=new Date();$("clock").textContent=`${d.getHours()}:${pad(d.getMinutes())}`};tick();setInterval(tick,30000);
const dayDiff=s=>Math.round((new Date(s+"T00:00:00")-new Date(todayStr+"T00:00:00"))/864e5);
let city="",dist="",room="",tab="open";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const all=()=>BASE.concat(store());
function seg(){["全部","台北市","新北市"].forEach((c,i)=>{const b=document.createElement("button");b.textContent=c;if(!i)b.className="on";
  b.onclick=()=>{city=i?c:"";dist="";[...$("seg").children].forEach(x=>x.classList.toggle("on",x===b));chips();render()};$("seg").appendChild(b)})}
function chips(){const c=$("chips");c.innerHTML="";
  const mk=(t,on,f)=>{const b=document.createElement("button");b.className="chip"+(on?" on":"");b.textContent=t;b.onclick=f;c.appendChild(b)};
  [...new Set(all().filter(x=>!city||x.city===city).map(x=>x.dist).filter(Boolean))].forEach(d=>mk(d,dist===d,()=>{dist=dist===d?"":d;chips();render()}));
  ["一房","二房","三房","四房"].forEach(r=>mk(r,room===r,()=>{room=room===r?"":r;chips();render()}))}
$("q").oninput=render;
[...document.querySelectorAll(".tab")].forEach(b=>b.onclick=()=>{tab=b.dataset.t;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));$("screen").scrollTop=0;render()});
$("addForm").onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const x=store();
  x.push({name:f.name,city:f.city,dist:f.dist,rooms:f.rooms.split(/[,，、 ]+/).filter(Boolean),units:+f.units||null,minRent:+f.minRent||0,
  start:f.start||undefined,drawDate:f.drawDate||undefined,drawText:f.drawDate?f.drawDate.slice(5).replace("-","/")+" 抽籤":undefined,end:f.end,endText:f.end.slice(5).replace("-","/")+" 截止",url:f.url,rent:[],custom:true});save(x);e.target.reset();chips();render()};
window.del=i=>{const x=store();x.splice(i,1);save(x);chips();render();return false};
function render(){
  const q=$("q").value.trim().toLowerCase(),ex=store();
  const base=all().map(d=>({...d,left:dayDiff(d.end),ex:d.custom?ex.findIndex(e=>e.name===d.name&&e.end===d.end):-1}))
    .map(d=>({...d,soon:!!d.start&&d.start>todayStr,startLeft:d.start?dayDiff(d.start):0}))
    .map(d=>({...d,open:!d.soon&&d.left>=0}))
    .filter(d=>(!city||d.city===city)&&(!dist||d.dist===dist)&&(!room||d.rooms.includes(room))&&
      (!q||(d.name+d.city+d.dist+d.addr+d.rooms.join()).toLowerCase().includes(q)));
  const nOpen=base.filter(d=>d.open).length,nSoon=base.filter(d=>d.soon).length;
  for(const[k,n]of[["open",nOpen],["soon",nSoon]]){const e=$("n-"+k);e.textContent=n;e.classList.toggle("z",!n)}
  const r=base.filter(d=>tab==="open"?d.open:tab==="soon"?d.soon:(!d.open&&!d.soon))
    .sort((a,b)=>tab==="soon"?a.start.localeCompare(b.start):a.end.localeCompare(b.end));
  $("count").textContent={open:`${r.length} 處受理中，依截止日排序`,soon:`${r.length} 處即將開放`,closed:`${r.length} 處已截止`}[tab];
  const none={open:"目前沒有受理中的社宅",soon:"目前沒有已公告、尚未開放的社宅<br>有新公告時會顯示在這裡",closed:"沒有已截止的社宅"}[tab];
  $("list").innerHTML=r.length?r.map((d,i)=>{
    const sd=d.start?d.start.slice(5).replace("-","/"):"";
    const badge=d.soon?`<div class="badge soon"><b>${d.startLeft}</b><span>天後開放</span></div>`:
      !d.open?`<div class="badge off"><b>—</b><span>已截止</span></div>`:
      d.left<=7?`<div class="badge"><b>${d.left||"今"}</b><span>${d.left?"天後截止":"天截止！"}</span></div>`:
      `<div class="badge ok"><b>${d.left}</b><span>天後截止</span></div>`;
    return `<div class="card${d.soon?" upcoming":""}" style="animation-delay:${i*70}ms"><div class="top"><div><div class="city">${d.city}${d.dist?" · "+esc(d.dist):""}</div>
    <h3>${esc(d.name)}</h3>${d.addr?`<div class="addr">${esc(d.addr)}</div>`:""}</div>${badge}</div>
    ${d.soon?`<div class="deadline soon"><i class="dot"></i>即將開放：${sd} 起受理・${esc(d.endText)}</div>`:
    `<div class="deadline ${d.open?"":"off"}"><i class="dot"></i>${d.open?"截止：":"已截止："}${esc(d.endText)}</div>`}
    ${d.drawText?`<div class="draw"><span>🎲 抽籤</span>${esc(d.drawText)}${d.drawDate&&dayDiff(d.drawDate)>=0?`<small>${dayDiff(d.drawDate)?dayDiff(d.drawDate)+" 天後":"今天"}</small>`:""}</div>`:""}
    ${d.minRent?`<div class="price"><b>${d.minRent.toLocaleString()}</b> 元／月起</div>`:""}
    <div class="tags">${d.rooms.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}${d.units?`<span class="tag">${d.units} 戶</span>`:""}</div>
    ${d.rent&&d.rent.length?`<table><tr><th>房型</th><th>月租（元）</th></tr>${d.rent.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</table>`:""}
    <div class="info">${d.draw?esc(d.draw)+"<br>":""}${d.operator?"受理單位："+esc(d.operator):""}</div>
    <div class="btns">${d.url?`<a class="btn" href="${esc(d.url)}" target="_blank" rel="noopener">線上申請</a>`:""}
    ${d.src?`<a class="btn alt" href="${esc(d.src)}" target="_blank" rel="noopener">來源</a>`:""}
    ${d.ex>=0?`<a class="btn alt" href="#" onclick="return del(${d.ex})">刪除</a>`:""}</div></div>`}).join(""):`<div class="empty">${none}</div>`;
}
seg();chips();render();
</script>
</body>
</html>
